[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-loki-updates"
version = "0.1.4"
description = "Instruções declarativas e compatibilidade de contrato para o Loki MCP"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2",
    "pypdf==6.14.2", "pypdfium2==5.12.1", "pillow==12.3.0",
    "openpyxl==3.1.5", "xlrd==2.0.2", "defusedxml==0.7.1", "jsonschema==4.25.1",
    "rfc3339-validator==0.1.4", "xlwt==1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_loki_updates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["jsonschema", "defusedxml.*", "pypdfium2.*", "openpyxl.*", "xlrd"]
ignore_missing_imports = true
